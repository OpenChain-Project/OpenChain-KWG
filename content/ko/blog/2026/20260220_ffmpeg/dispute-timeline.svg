<svg xmlns="http://www.w3.org/2000/svg" width="880" height="668" viewBox="0 0 880 668">
  <defs>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="880" height="668" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <!-- 축 -->
    <line x1="163" y1="46" x2="163" y2="622" stroke="#d1d5db" stroke-width="1.5"/>

    <!-- 비활성 구간 축 강조 -->
    <line x1="163" y1="268" x2="163" y2="514" stroke="#c2410c" stroke-width="3.5"/>

    <!-- 1. 2024-02-23 -->
    <text x="140" y="73" text-anchor="end" font-size="13" fill="#374151">2024-02-23</text>
    <circle cx="163" cy="68" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="192" y="40" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="64" font-size="15" fill="#111827">FFmpeg가 공개 지적</text>
    <text x="212" y="84" font-size="12.5" fill="#6b7280">MPP 이슈 530 개설 — 포크 관리자가 전달</text>

    <!-- 정체 구간 -->
    <line x1="163" y1="96" x2="163" y2="158" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="212" y="122" font-size="13.5" fill="#4b5563">약 22개월</text>
    <text x="212" y="142" font-size="12.5" fill="#9ca3af">응답은 있었으나 시정되지 않음</text>

    <!-- 2. 2025-12-18 -->
    <text x="140" y="191" text-anchor="end" font-size="13" fill="#374151">2025-12-18</text>
    <circle cx="163" cy="186" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="192" y="158" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="182" font-size="15" fill="#111827">DMCA 통지 제출</text>
    <text x="212" y="202" font-size="12.5" fill="#6b7280">FFmpeg 기여자가 침해 파일 12개 지목</text>

    <!-- 3. 2025-12-26경 -->
    <text x="140" y="273" text-anchor="end" font-size="13" fill="#374151">2025-12-26경</text>
    <circle cx="163" cy="268" r="5" fill="#c2410c" stroke="#c2410c" stroke-width="2"/>
    <rect x="192" y="240" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="264" font-size="15" fill="#111827">저장소 비활성화</text>
    <text x="212" y="284" font-size="12.5" fill="#6b7280">GitHub이 rockchip-linux/mpp 차단</text>

    <!-- 4. 2025-12-29 -->
    <text x="140" y="355" text-anchor="end" font-size="13" fill="#374151">2025-12-29</text>
    <circle cx="163" cy="350" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <rect x="192" y="322" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="346" font-size="15" fill="#111827">LGPL 헤더 복원</text>
    <text x="212" y="366" font-size="12.5" fill="#6b7280">지목된 12개 파일에 FFmpeg 저작권 표시 되돌림</text>

    <!-- 5. 2026-01-15 ~ 02-12 -->
    <text x="140" y="427" text-anchor="end" font-size="13" fill="#374151">2026-01-15</text>
    <text x="140" y="445" text-anchor="end" font-size="13" fill="#374151">~ 02-12</text>
    <circle cx="163" cy="432" r="5" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
    <rect x="192" y="404" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="428" font-size="15" fill="#111827">세 코덱 파서 교체</text>
    <text x="212" y="448" font-size="12.5" fill="#6b7280">VP9, AV1, H.265 순으로 공개 저장소에 반영</text>

    <!-- 6. 2026-03-06 ~ 03-11 -->
    <text x="140" y="509" text-anchor="end" font-size="13" fill="#374151">2026-03-06</text>
    <text x="140" y="527" text-anchor="end" font-size="13" fill="#374151">~ 03-11</text>
    <circle cx="163" cy="514" r="5" fill="#c2410c" stroke="#c2410c" stroke-width="2"/>
    <rect x="192" y="486" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="510" font-size="15" fill="#111827">저장소 복구</text>
    <text x="212" y="530" font-size="12.5" fill="#6b7280">정확한 날짜는 공개되지 않음</text>

    <!-- 7. 현재 -->
    <text x="140" y="601" text-anchor="end" font-size="13" fill="#374151">2026-07 현재</text>
    <circle cx="163" cy="596" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <rect x="192" y="568" width="500" height="56" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#sh)"/>
    <text x="212" y="592" font-size="15" fill="#111827">FFmpeg 측 수용 기록 없음</text>
    <text x="212" y="612" font-size="12.5" fill="#6b7280">이슈 530을 닫은 것은 제3자 포크 관리자</text>

    <!-- 비활성 기간 브래킷 -->
    <path d="M 716 268 L 734 268 L 734 514 L 716 514" fill="none" stroke="#c2410c" stroke-width="1.6"/>
    <text x="748" y="374" font-size="13.5" fill="#c2410c">저장소가</text>
    <text x="748" y="393" font-size="13.5" fill="#c2410c">내려가 있던</text>
    <text x="748" y="413" font-size="15" font-weight="600" fill="#c2410c">약 10주</text>
  </g>
</svg>
