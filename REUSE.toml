version = 1

# Later annotations take precedence over earlier ones when several match the same file.
#
# Licensing history: documentation published before November 12, 2026 was
# released under CC-BY-4.0. Documentation published on or after that date is
# dedicated to the public domain under CC0-1.0. Existing CC-BY-4.0 material
# cannot be moved to CC0-1.0 without the agreement of its copyright holders,
# so the default below stays CC-BY-4.0 and CC0-1.0 is applied only to new
# content.

# 1. Default rule: everything not matched below is CC-BY-4.0.
# precedence = "closest" lets a file's own SPDX header win, so a new page
# outside the blog is placed under CC0-1.0 by adding to its front matter:
#   SPDX-FileCopyrightText: The OpenChain KWG Authors
#   SPDX-License-Identifier: CC0-1.0
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "The OpenChain KWG Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# 2. Blog posts are CC0-1.0 by default; posts published before
# November 12, 2026 are returned to CC-BY-4.0 in rule 7.
# No CC0-1.0 content exists yet, so LICENSES/CC0-1.0.txt is not in the repo
# (REUSE rejects unused license texts). When the first CC0-1.0 file is added,
# `reuse lint` will report it as missing; add it with `reuse download CC0-1.0`.
[[annotations]]
path = "content/*/blog/**"
precedence = "override"
SPDX-FileCopyrightText = "The OpenChain KWG Authors"
SPDX-License-Identifier = "CC0-1.0"

# 3. Website code stays under Apache-2.0.
[[annotations]]
path = [
    "layouts/**",
    "assets/scss/**",
    "archetypes/**",
    "i18n/**",
    "docs/slides/v6/components/**",
    "docs/slides/v6/setup/**",
    "docs/slides/v6/styles/**",
    "docs/slides/v6/*.json",
    "docs/slides/v6/*.ts",
    ".github/**",
    ".vscode/**",
    ".gitignore",
    ".gitmodules",
    ".hugo_build.lock",
    "Dockerfile",
    "docker-compose.yaml",
    "package.json",
    "package-lock.json",
    "go.mod",
    "go.sum",
    "docsy.work",
    "docsy.work.sum",
    "hugo.toml",
    "config.yaml",
]
precedence = "override"
SPDX-FileCopyrightText = "The OpenChain KWG Authors"
SPDX-License-Identifier = "Apache-2.0"

# Several files in layouts/ are modified copies of Docsy templates
# (Apache-2.0), so the Docsy Authors are credited alongside the KWG.
[[annotations]]
path = "layouts/**"
precedence = "override"
SPDX-FileCopyrightText = ["The OpenChain KWG Authors", "The Docsy Authors"]
SPDX-License-Identifier = "Apache-2.0"

# 4. Bundled third-party assets keep their upstream licenses.
[[annotations]]
path = "static/vendor/jquery/**"
precedence = "override"
SPDX-FileCopyrightText = "OpenJS Foundation and other contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "static/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = "The Roboto Project Authors and The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# 5. Guides (and all sub-pages/assets) remaining under CC-BY-4.0 (Korean & English).
# These are already covered by the default, but are listed explicitly so they
# stay CC-BY-4.0 if the default ever changes.
[[annotations]]
path = [
    "content/*/guide/_index.md",
    "content/*/guide/iso5230_guide/**",
    "content/*/guide/iso18974_guide/**",
    "content/*/guide/opensource_for_enterprise/**",
    "content/*/guide/finance-oss-guide/**",
    "content/*/guide/iso42001_guide/**",
    "content/*/guide/ai-sbom_guide/**",
    "content/*/guide/templates/**",
    "content/*/guide/tools/**",
    "content/*/guide/training-slides/**",
    "content/*/guide/archive/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The OpenChain KWG Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# 6. Korean translations of third-party CC-BY-4.0 resources.
# Directory names are case-sensitive.
[[annotations]]
path = [
    "content/*/resource/SBOM_work_group/sbom_guide/**",
    "content/*/resource/Telco_work_group/telco_sbom/**",
]
precedence = "override"
SPDX-FileCopyrightText = "Original Authors and The OpenChain KWG Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# 7. Blog posts published before November 12, 2026
# (post directories are named YYYYMMDD_slug), plus blog index and sample pages
# that predate the change.
[[annotations]]
path = [
    "content/*/blog/_index.md",
    "content/*/blog/2026/_index.md",
    "content/*/blog/sample/**",
    "content/*/blog/2019/**",
    "content/*/blog/2020/**",
    "content/*/blog/2021/**",
    "content/*/blog/2022/**",
    "content/*/blog/2023/**",
    "content/*/blog/2024/**",
    "content/*/blog/2025/**",
    "content/*/blog/2026/202601*/**",
    "content/*/blog/2026/202602*/**",
    "content/*/blog/2026/202603*/**",
    "content/*/blog/2026/202604*/**",
    "content/*/blog/2026/202605*/**",
    "content/*/blog/2026/202606*/**",
    "content/*/blog/2026/202607*/**",
    "content/*/blog/2026/202608*/**",
    "content/*/blog/2026/202609*/**",
    "content/*/blog/2026/202610*/**",
    "content/*/blog/2026/2026110*/**",
    "content/*/blog/2026/20261110*/**",
    "content/*/blog/2026/20261111*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The OpenChain KWG Authors"
SPDX-License-Identifier = "CC-BY-4.0"

# 8. Logos, trademarks, and quoted press materials belong to their owners
# and are not licensed by the OpenChain KWG.
[[annotations]]
path = [
    "content/*/blog/news/**",
    "**/*logo*",
    "**/*Logo*",
    "**/*LOGO*",
    "__document/logo/*.png",
    "__document/logo/*.gif",
    "__document/logo/logo-images/**",
    "static/images/content/about/logo/**",
    "static/favicons/**",
    "static/images/kwg-logo-nav.webp",
    "static/kakao.png",
    "static/lge.png",
    "static/line.png",
    "static/nipg-logo.png",
    "static/samsung.png",
    "assets/icons/logo-oc.svg",
]
precedence = "override"
SPDX-FileCopyrightText = "Respective trademark and copyright owners"
SPDX-License-Identifier = "LicenseRef-ThirdParty"
