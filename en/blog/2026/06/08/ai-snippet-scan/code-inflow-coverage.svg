<svg xmlns="http://www.w3.org/2000/svg" width="820" height="392" viewBox="0 0 820 392">
  <defs>
    <filter id="c1" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="820" height="392" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <!-- column labels -->
    <text x="40" y="30" font-size="12" letter-spacing="1.6" fill="#6b7280">HOW CODE COMES IN</text>
    <text x="530" y="30" font-size="12" letter-spacing="1.6" fill="#6b7280">WHAT CATCHES IT</text>

    <!-- path 1 -->
    <rect x="40" y="56" width="340" height="66" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#c1)"/>
    <text x="60" y="84" font-size="15" fill="#111827">Declared through a package manager</text>
    <text x="60" y="106" font-size="12.5" fill="#6b7280">Listed in package.json, pom.xml and the like</text>

    <!-- path 2 -->
    <rect x="40" y="142" width="340" height="66" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#c1)"/>
    <text x="60" y="170" font-size="15" fill="#111827">Copy and paste, AI generation</text>
    <text x="60" y="192" font-size="12.5" fill="#6b7280">Mixed into the body, never declared</text>

    <!-- path 3 -->
    <rect x="40" y="228" width="340" height="76" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#c1)"/>
    <text x="60" y="256" font-size="15" fill="#111827">Whole source copied in</text>
    <text x="60" y="278" font-size="12.5" fill="#6b7280">Embedded and firmware. There is no</text>
    <text x="60" y="296" font-size="12.5" fill="#6b7280">manifest to read at all</text>

    <!-- connectors -->
    <line x1="380" y1="89" x2="524" y2="89" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ca)"/>

    <path d="M 380 175 L 452 175 L 452 230" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <path d="M 380 266 L 452 266 L 452 230" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
    <line x1="452" y1="230" x2="524" y2="230" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ca)"/>

    <!-- method 1 -->
    <rect x="532" y="56" width="248" height="66" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#c1)"/>
    <text x="552" y="84" font-size="15" fill="#111827">Dependency-level SCA</text>
    <text x="552" y="106" font-size="12.5" fill="#6b7280">Sees only what is declared</text>

    <!-- method 2 (highlight) -->
    <rect x="532" y="182" width="248" height="96" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#c1)"/>
    <text x="552" y="212" font-size="15" font-weight="600" fill="#c2410c">Snippet matching</text>
    <text x="552" y="236" font-size="12.5" fill="#6b7280">All but the only way to find</text>
    <text x="552" y="254" font-size="12.5" fill="#6b7280">fragments nobody declared</text>

    <!-- note -->
    <line x1="40" y1="336" x2="780" y2="336" stroke="#e5e7eb" stroke-width="1"/>
    <text x="40" y="358" font-size="12.5" fill="#4b5563">Separate from after-the-fact scanning, blocking public code in AI tools reduces the second path at the source.</text>
    <text x="40" y="378" font-size="12.5" fill="#4b5563">On the third path, snippet matching is not a conditional aid but the primary method.</text>
  </g>
</svg>
