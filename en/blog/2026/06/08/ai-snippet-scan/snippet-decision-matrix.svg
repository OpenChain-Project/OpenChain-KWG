<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="m1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <g font-family="system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif">

    <!-- vertical axis -->
    <line x1="130" y1="410" x2="130" y2="52" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="116" y="128" text-anchor="end" font-size="13" fill="#4b5563">Code or binaries</text>
    <text x="116" y="148" text-anchor="end" font-size="13" fill="#4b5563">go outside</text>
    <text x="116" y="298" text-anchor="end" font-size="13" fill="#4b5563">They stay</text>
    <text x="116" y="318" text-anchor="end" font-size="13" fill="#4b5563">inside</text>

    <!-- horizontal axis -->
    <line x1="130" y1="410" x2="740" y2="410" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="435" y="440" text-anchor="middle" font-size="13" fill="#4b5563">Something outside prompts a check of where the code came from</text>
    <text x="152" y="430" font-size="12" fill="#9ca3af">None</text>
    <text x="700" y="430" text-anchor="end" font-size="12" fill="#9ca3af">Present</text>

    <!-- top left -->
    <rect x="150" y="60" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="170" y="90" font-size="15" fill="#111827">It depends</text>
    <text x="170" y="118" font-size="12.5" fill="#6b7280">Code or binaries go out, but</text>
    <text x="170" y="138" font-size="12.5" fill="#6b7280">nothing prompts a look inside</text>
    <text x="170" y="172" font-size="12.5" fill="#9ca3af">Duties arise here but stay</text>
    <text x="170" y="190" font-size="12.5" fill="#9ca3af">latent</text>

    <!-- top right (highlight) -->
    <rect x="440" y="60" width="270" height="150" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#m1)"/>
    <text x="460" y="90" font-size="15" font-weight="600" fill="#c2410c">Weighs heavily</text>
    <text x="460" y="118" font-size="12.5" fill="#6b7280">On-premises products, SDKs</text>
    <text x="460" y="138" font-size="12.5" fill="#6b7280">and firmware ship out, and</text>
    <text x="460" y="158" font-size="12.5" fill="#6b7280">M&amp;A diligence or audits follow</text>
    <text x="460" y="190" font-size="12.5" fill="#c2410c">Where buried duties surface</text>

    <!-- bottom left -->
    <rect x="150" y="230" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="170" y="260" font-size="15" fill="#111827">Low</text>
    <text x="170" y="288" font-size="12.5" fill="#6b7280">Pure SaaS</text>
    <text x="170" y="308" font-size="12.5" fill="#6b7280">No AGPL components</text>
    <text x="170" y="342" font-size="12.5" fill="#9ca3af">Not distribution, so copyleft</text>
    <text x="170" y="360" font-size="12.5" fill="#9ca3af">duties rarely arise</text>

    <!-- bottom right -->
    <rect x="440" y="230" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="460" y="260" font-size="15" fill="#111827">Low</text>
    <text x="460" y="288" font-size="12.5" fill="#6b7280">Even under audit, with no</text>
    <text x="460" y="308" font-size="12.5" fill="#6b7280">distribution little is at issue</text>
    <text x="460" y="342" font-size="12.5" fill="#9ca3af">If an SBOM is requested,</text>
    <text x="460" y="360" font-size="12.5" fill="#9ca3af">answer at dependency level</text>

    <!-- exception note -->
    <line x1="150" y1="466" x2="710" y2="466" stroke="#e5e7eb" stroke-width="1"/>
    <text x="150" y="488" font-size="12.5" fill="#4b5563">Exception — with no manifest, embedded builds need snippet scanning in any quadrant.</text>
  </g>
</svg>
