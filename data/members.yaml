# OpenChain KWG 참여 회사 목록
#
# 이 파일 하나가 About > Member 페이지의 원본이다. 한국어와 영어 페이지가 같은
# 데이터를 쓰고, 회사 수와 산업군 집계는 렌더 시 계산하므로 따로 적지 않는다.
#
# 갱신 방법
#   1. 메일링리스트(korea-wg) 가입자의 소속을 확인한다.
#   2. 해당 산업군의 companies 에 ko / en 을 추가한다.
#   3. 로고 파일이 있으면 static/images/content/about/logo/ 에 넣고 logo 에 파일명만 적는다.
#      logo 가 없으면 이름 칩으로 표시되므로 비워 두어도 페이지는 깨지지 않는다.
#
# 산업군 구분은 정기 모임 사전 설문의 '소속 산업군' 보기를 따른다.

