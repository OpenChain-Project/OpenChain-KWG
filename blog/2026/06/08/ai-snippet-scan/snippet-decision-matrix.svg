<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <filter id="m1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#000" flood-opacity="0.10"/>
    </filter>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="#ffffff"/>
  <g font-family="'Apple SD Gothic Neo','Noto Sans CJK KR','Malgun Gothic',sans-serif">

    <!-- 세로축 -->
    <line x1="130" y1="410" x2="130" y2="52" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="116" y="128" text-anchor="end" font-size="13" fill="#4b5563">코드나 바이너리를</text>
    <text x="116" y="148" text-anchor="end" font-size="13" fill="#4b5563">외부에 전달함</text>
    <text x="116" y="298" text-anchor="end" font-size="13" fill="#4b5563">전달하지</text>
    <text x="116" y="318" text-anchor="end" font-size="13" fill="#4b5563">않음</text>

    <!-- 가로축 -->
    <line x1="130" y1="410" x2="740" y2="410" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#ax)"/>
    <text x="435" y="440" text-anchor="middle" font-size="13" fill="#4b5563">외부에서 코드 출처를 확인하는 계기</text>
    <text x="152" y="430" font-size="12" fill="#9ca3af">없음</text>
    <text x="700" y="430" text-anchor="end" font-size="12" fill="#9ca3af">있음</text>

    <!-- 좌상: 전달O 검증X -->
    <rect x="150" y="60" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="170" y="90" font-size="15" fill="#111827">상황에 따라</text>
    <text x="170" y="118" font-size="12.5" fill="#6b7280">코드나 바이너리는 나가지만</text>
    <text x="170" y="138" font-size="12.5" fill="#6b7280">밖에서 들여다볼 계기가 없음</text>
    <text x="170" y="172" font-size="12.5" fill="#9ca3af">의무는 생기되 잠재 상태에</text>
    <text x="170" y="190" font-size="12.5" fill="#9ca3af">머무는 구간</text>

    <!-- 우상: 전달O 검증O (강조) -->
    <rect x="440" y="60" width="270" height="150" rx="8" fill="#fff" stroke="#c2410c" stroke-width="1.8" filter="url(#m1)"/>
    <text x="460" y="90" font-size="15" font-weight="600" fill="#c2410c">비중 높음</text>
    <text x="460" y="118" font-size="12.5" fill="#6b7280">온프레미스 제품, SDK,</text>
    <text x="460" y="138" font-size="12.5" fill="#6b7280">펌웨어를 내보내면서</text>
    <text x="460" y="158" font-size="12.5" fill="#6b7280">인수합병 실사나 고객 감사를 받음</text>
    <text x="460" y="190" font-size="12.5" fill="#c2410c">묻혀 있던 의무가 드러나는 지점</text>

    <!-- 좌하: 전달X 검증X -->
    <rect x="150" y="230" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="170" y="260" font-size="15" fill="#111827">낮음</text>
    <text x="170" y="288" font-size="12.5" fill="#6b7280">순수 SaaS</text>
    <text x="170" y="308" font-size="12.5" fill="#6b7280">AGPL 구성요소 미사용</text>
    <text x="170" y="342" font-size="12.5" fill="#9ca3af">배포가 아니라 카피레프트</text>
    <text x="170" y="360" font-size="12.5" fill="#9ca3af">의무가 잘 생기지 않음</text>

    <!-- 우하: 전달X 검증O -->
    <rect x="440" y="230" width="270" height="150" rx="8" fill="#fff" stroke="#d1d5db" filter="url(#m1)"/>
    <text x="460" y="260" font-size="15" fill="#111827">낮음</text>
    <text x="460" y="288" font-size="12.5" fill="#6b7280">감사를 받더라도 배포가 없으면</text>
    <text x="460" y="308" font-size="12.5" fill="#6b7280">따질 의무 자체가 적음</text>
    <text x="460" y="342" font-size="12.5" fill="#9ca3af">SBOM 제출 요구가 있으면</text>
    <text x="460" y="360" font-size="12.5" fill="#9ca3af">의존성 단위로 대응</text>

    <!-- 예외 주석 -->
    <line x1="150" y1="466" x2="710" y2="466" stroke="#e5e7eb" stroke-width="1"/>
    <text x="150" y="488" font-size="12.5" fill="#4b5563">예외 — 매니페스트 없이 빌드하는 임베디드는 사분면과 무관하게 스니펫 검사가 기본 수단입니다.</text>
  </g>
</svg>
